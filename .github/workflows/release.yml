name: verify-and-attest-draft-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable-version draft release tag
        required: true
        type: string
      confirm_draft_only:
        description: Type DRAFT-ONLY. This workflow never publishes.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: loom-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  reproduce-candidates:
    if: inputs.confirm_draft_only == 'DRAFT-ONLY'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {candidate: A, suffix: ""}
          - {candidate: B, suffix: "-repro"}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Reconstruct one finalized candidate from source and exact native evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_ID: ${{ matrix.candidate }}
          ASSET_SUFFIX: ${{ matrix.suffix }}
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern "loom-plugin-${RELEASE_TAG}${ASSET_SUFFIX}.zip" --dir input
          INPUT="input/loom-plugin-${RELEASE_TAG}${ASSET_SUFFIX}.zip"
          python -B tools/loom_release_verify.py "$INPUT"
          COMPATIBILITY_RUN="$(python -B - <<'PY'
          import json,os,subprocess
          rows=json.loads(subprocess.run(
              ["gh","run","list","--workflow","compatibility.yml","--commit",os.environ["GITHUB_SHA"],"--event","push","--limit","20","--json","databaseId,headBranch,headSha,status,conclusion"],
              check=True,capture_output=True,text=True).stdout)
          matches=[row for row in rows if row["headBranch"] == "main" and row["headSha"] == os.environ["GITHUB_SHA"] and row["status"] == "completed" and row["conclusion"] == "success"]
          if not matches: raise SystemExit("no successful exact-main compatibility run")
          print(max(int(row["databaseId"]) for row in matches))
          PY
          )"
          gh run download "$COMPATIBILITY_RUN" \
            --pattern "native-helper-*-${GITHUB_SHA}" --dir native-artifacts
          test "$(find native-artifacts -name receipt.json -type f | wc -l)" -eq 6
          python -B tools/loom_release_candidate.py reconstruct . "$INPUT" \
            native-artifacts "candidate-${CANDIDATE_ID}.zip" \
            --source-commit "$GITHUB_SHA"
          cmp "$INPUT" "candidate-${CANDIDATE_ID}.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.candidate }}
          path: candidate-${{ matrix.candidate }}.zip
          retention-days: 1
          if-no-files-found: error

  release:
    needs: reproduce-candidates
    if: inputs.confirm_draft_only == 'DRAFT-ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    environment: loom-release
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-candidate-*
          path: candidate-jobs
          merge-multiple: true
      - name: Require clean exact signed tag on default branch
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          LOOM_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.LOOM_RELEASE_SIGNING_PUBLIC_KEY }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$LOOM_RELEASE_SIGNING_PUBLIC_KEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,3}$ ]]
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "${GITHUB_SHA}"
          printf 'loom-release@users.noreply.github.com %s\n' "$LOOM_RELEASE_SIGNING_PUBLIC_KEY" \
            > "$RUNNER_TEMP/loom-release-allowed-signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/loom-release-allowed-signers"
          git verify-tag "$RELEASE_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Rebuild the public cut twice and verify static identity
        shell: bash
        run: |
          python -B tools/loom_release.py build . "$RUNNER_TEMP/cut-a" --source-classification public-release
          python -B tools/loom_release.py build . "$RUNNER_TEMP/cut-b" --source-classification public-release
          diff -qr "$RUNNER_TEMP/cut-a" "$RUNNER_TEMP/cut-b"
          python -B tools/loom_release.py verify-cut-static "$RUNNER_TEMP/cut-a" --output "$RUNNER_TEMP/cut-receipt.json"
      - name: Bind exact main capability evidence
        env:
          GH_TOKEN: ${{ github.token }}
          LOOM_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python -B - <<'PY' > "$RUNNER_TEMP/main-runs.env"
          import json
          import os
          import subprocess

          sha = os.environ["LOOM_SOURCE_SHA"]

          def exact_success(workflow):
              completed = subprocess.run(
                  ["gh", "run", "list", "--workflow", workflow, "--commit", sha,
                   "--event", "push", "--limit", "20", "--json",
                   "databaseId,headBranch,headSha,status,conclusion"],
                  check=True, capture_output=True, text=True,
              )
              rows = json.loads(completed.stdout)
              matches = [row for row in rows if row["headBranch"] == "main"
                         and row["headSha"] == sha and row["status"] == "completed"
                         and row["conclusion"] == "success"]
              if not matches:
                  raise SystemExit(f"no successful exact-main {workflow} run")
              return max(int(row["databaseId"]) for row in matches)

          def exact_dispatch_success(workflow):
              completed = subprocess.run(
                  ["gh", "run", "list", "--workflow", workflow,
                   "--commit", sha, "--event", "workflow_dispatch",
                   "--limit", "20", "--json",
                   "databaseId,headBranch,headSha,status,conclusion"],
                  check=True, capture_output=True, text=True,
              )
              rows = json.loads(completed.stdout)
              matches = [row for row in rows if row["headBranch"] == "main"
                         and row["headSha"] == sha
                         and row["status"] == "completed"
                         and row["conclusion"] == "success"]
              if not matches:
                  raise SystemExit(
                      f"no successful exact-main {workflow} dispatch")
              return max(int(row["databaseId"]) for row in matches)

          print(f"QUALITY_RUN={exact_success('quality.yml')}")
          print(f"COMPATIBILITY_RUN={exact_success('compatibility.yml')}")
          print(
              f"ADMISSION_RUN={exact_dispatch_success('candidate-admission.yml')}")
          PY
          source "$RUNNER_TEMP/main-runs.env"
          test -n "$QUALITY_RUN" -a -n "$COMPATIBILITY_RUN" \
            -a -n "$ADMISSION_RUN"
          gh run download "$QUALITY_RUN" --pattern 'full-test-timings-*' \
            --dir "$RUNNER_TEMP/capability-reports"
          gh run download "$QUALITY_RUN" --pattern 'quality-matrix-certificate' \
            --dir "$RUNNER_TEMP/quality-certificate"
          gh run download "$COMPATIBILITY_RUN" --pattern 'compatibility-suite-*' \
            --dir "$RUNNER_TEMP/compatibility-reports"
          gh run download "$COMPATIBILITY_RUN" --pattern 'compatibility-matrix-certificate' \
            --dir "$RUNNER_TEMP/compatibility-certificate"
          gh run download "$COMPATIBILITY_RUN" --pattern "native-helper-*-${LOOM_SOURCE_SHA}" \
            --dir "$RUNNER_TEMP/native-downloaded"
          gh run download "$ADMISSION_RUN" \
            --pattern "candidate-admission-v2-${LOOM_SOURCE_SHA}" \
            --dir "$RUNNER_TEMP/candidate-admission"
          test "$(find "$RUNNER_TEMP/native-downloaded" -name receipt.json -type f | wc -l)" -eq 6
          test "$(find "$RUNNER_TEMP/candidate-admission" \
            -name candidate-admission-v2.json -type f | wc -l)" -eq 1
          MODE="$(python -B -c 'import json; print(json.load(open("contracts/release-suite-policy-v1.json",encoding="utf-8"))["authority_mode"])')"
          if test "$MODE" = serial; then
            test "$(find "$RUNNER_TEMP/capability-reports" -name full-test-timings.json -type f | wc -l)" -eq 15
            test "$(find "$RUNNER_TEMP/compatibility-reports" -name full-test-timings.json -type f | wc -l)" -eq 15
          fi
      - name: Compile existing serial authority and run rollback battery
        working-directory: tools
        env:
          LOOM_CUT_RECEIPT: ${{ runner.temp }}/cut-receipt.json
          LOOM_MATRIX_ROOT: ${{ runner.temp }}/capability-reports
          LOOM_SOURCE_SHA: ${{ github.sha }}
        run: |
          PUBLIC_ROOT="$(python -B -c 'import json,os; print(json.load(open(os.environ["LOOM_CUT_RECEIPT"], encoding="utf-8"))["root_sha256"])')"
          MODE="$(python -B -c 'import json; print(json.load(open("../contracts/release-suite-policy-v1.json",encoding="utf-8"))["authority_mode"])')"
          if test "$MODE" = serial; then
            mapfile -t QUALITY_REPORTS < <(find "$LOOM_MATRIX_ROOT" -name full-test-timings.json -type f | sort)
            mapfile -t COMPATIBILITY_REPORTS < <(find "$RUNNER_TEMP/compatibility-reports" -name full-test-timings.json -type f | sort)
            ARGS=(--serial-evidence-only --policy ../contracts/release-suite-policy-v1.json)
            for report in "${QUALITY_REPORTS[@]}"; do ARGS+=(--quality-report "$report"); done
            for report in "${COMPATIBILITY_REPORTS[@]}"; do ARGS+=(--compatibility-report "$report"); done
            python -B loom_release_suite.py "${ARGS[@]}" --commit "$LOOM_SOURCE_SHA" \
              --public-root "$PUBLIC_ROOT" --output "$RUNNER_TEMP/full-suite.json"
            CLEAN_REPORT="$(find "$RUNNER_TEMP/compatibility-reports" -path '*ubuntu-24.04-py3.11*' -name full-test-timings.json -type f -print -quit)"
            test -n "$CLEAN_REPORT"
            python -B loom_clean_room.py "$RUNNER_TEMP/cut-a" --serial-suite "$CLEAN_REPORT" \
              --policy ../contracts/release-suite-policy-v1.json --output "$RUNNER_TEMP/clean-room.json"
          else
            QUALITY_CERT="$RUNNER_TEMP/quality-certificate/quality-matrix-certificate.json"
            COMPAT_CERT="$RUNNER_TEMP/compatibility-certificate/compatibility-matrix-certificate.json"
            python -B loom_release_suite.py --policy ../contracts/release-suite-policy-v1.json \
              --qualification ../contracts/release-suite-qualification-v1.json \
              --matrix-certificate "$QUALITY_CERT" --matrix-certificate "$COMPAT_CERT" \
              --commit "$LOOM_SOURCE_SHA" --public-root "$PUBLIC_ROOT" \
              --output "$RUNNER_TEMP/full-suite.json"
            python -B - "$COMPAT_CERT" "$RUNNER_TEMP/clean-room-cell.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          matches=[cell for cell in value["cells"] if cell["environment"]["requested_label"] == "ubuntu-24.04" and cell["environment"]["python_version"].startswith("3.11.")]
          assert len(matches) == 1
          json.dump(matches[0],open(sys.argv[2],"w",encoding="utf-8"),sort_keys=True,separators=(",", ":"))
          PY
            python -B loom_clean_room.py "$RUNNER_TEMP/cut-a" \
              --suite-certificate "$RUNNER_TEMP/clean-room-cell.json" \
              --policy ../contracts/release-suite-policy-v1.json --output "$RUNNER_TEMP/clean-room.json"
          fi
          python -B loom_release_rollback.py . --commit "$LOOM_SOURCE_SHA" \
            --public-root "$PUBLIC_ROOT" --output "$RUNNER_TEMP/rollback.json"
          python -B loom_current_facts.py ../contracts/current-facts-v1.json
      - name: Verify the separated exact candidate and compile its suite authority
        shell: bash
        run: |
          CANDIDATE="$(find "$RUNNER_TEMP/candidate-admission" \
            -name candidate-admission-v2.json -type f -print -quit)"
          test -n "$CANDIDATE"
          SOURCE_TREE="$(python -B -c 'import os,sys; sys.path.insert(0,"tools"); import loom_subject_identity as s; print(s.git_tree_inventory(".",os.environ["GITHUB_SHA"])["tree_sha256"])')"
          PUBLIC_ROOT="$(python -B -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"cut-receipt.json"),encoding="utf-8"))["root_sha256"])')"
          POLICY="contracts/release-authority-policy-v2.json"
          MODE="$(python -B -c 'import json; print(json.load(open("contracts/release-authority-policy-v2.json",encoding="utf-8"))["authority_mode"])')"
          VERIFY=(verify-candidate --root . --candidate "$CANDIDATE" \
            --expected-commit "$GITHUB_SHA" --expected-tree "$SOURCE_TREE" \
            --expected-public-root "$PUBLIC_ROOT" --policy "$POLICY")
          AUTHORITY=(--root . --candidate "$CANDIDATE" \
            --expected-commit "$GITHUB_SHA" --expected-tree "$SOURCE_TREE" \
            --expected-public-root "$PUBLIC_ROOT" --policy "$POLICY")
          if test "$MODE" = certificate; then
            test -f contracts/release-mechanism-qualification-v2.json
            VERIFY+=(--mechanism contracts/release-mechanism-qualification-v2.json)
            AUTHORITY+=(--mechanism contracts/release-mechanism-qualification-v2.json)
          else
            test "$MODE" = serial
            test ! -f contracts/release-mechanism-qualification-v2.json
          fi
          python -B tools/loom_qualification_v2.py "${VERIFY[@]}"
          cp "$CANDIDATE" "$RUNNER_TEMP/candidate-admission-v2.json"
          python -B tools/loom_release_authority.py candidate-suite \
            "${AUTHORITY[@]}" \
            --output "$RUNNER_TEMP/release-candidate-suite-v2.json"
      - name: Download existing draft assets without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --dir release-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/base-release.json"
      - name: Verify canonical base assets without a final manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          python -B tools/loom_release_promotion.py verify-base-assets release-assets \
            --tag "$RELEASE_TAG" \
            --api-release "$RUNNER_TEMP/base-release.json"
          cd tools
          python -B loom_release_verify.py "../release-assets/loom-plugin-${RELEASE_TAG}.zip"
          python -B -c 'import json; assert json.load(open("../release-assets/RELEASE-SUBJECT.json",encoding="utf-8"))["schema_version"] == 4'
          test -f ../release-assets/CODEX-APP-EVIDENCE.json
      - name: Expand exact native release evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          for platform in windows-x64 windows-arm64 macos-x64 macos-arm64 linux-x64 linux-arm64; do
            RECEIPT="$(python -B - "$RUNNER_TEMP/native-downloaded" "$platform" <<'PY'
          import json,sys
          from pathlib import Path
          matches=[]
          for path in Path(sys.argv[1]).rglob("receipt.json"):
              try: value=json.loads(path.read_text(encoding="utf-8"))
              except (OSError,UnicodeError,json.JSONDecodeError): continue
              if value.get("platform") == sys.argv[2]: matches.append(path)
          if len(matches) != 1: raise SystemExit("native receipt coverage is ambiguous")
          print(matches[0])
          PY
          )"
            mkdir "$RUNNER_TEMP/native/$platform"
            cp "$(dirname "$RECEIPT")"/* "$RUNNER_TEMP/native/$platform/"
            archive="release-assets/native-evidence-${platform}.zip"
            test -f "$archive"
            mkdir "$RUNNER_TEMP/draft-native-$platform"
            unzip -q "$archive" -d "$RUNNER_TEMP/draft-native-$platform"
            diff -qr "$RUNNER_TEMP/native/$platform" "$RUNNER_TEMP/draft-native-$platform"
            test "$(find "$RUNNER_TEMP/native/$platform" -type f | wc -l)" -ge 6
          done
      - name: Compare independent candidate A and B and bind native subjects
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path
          rows=[]
          for platform in ("windows-x64","windows-arm64","macos-x64","macos-arm64","linux-x64","linux-arm64"):
              receipt=json.loads(Path(os.environ["RUNNER_TEMP"],"native",platform,"receipt.json").read_text(encoding="utf-8"))
              rows.append({"platform":platform,"binary_sha256":receipt["binary_sha256"],
                           "sbom_sha256":receipt["sbom_sha256"],
                           "provenance_sha256":receipt["provenance_sha256"]})
          Path(os.environ["RUNNER_TEMP"],"native-subjects.json").write_text(
              json.dumps(rows,sort_keys=True,separators=(",", ":"))+"\n",encoding="utf-8")
          PY
          PUBLIC_ROOT="$(python -B -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"cut-receipt.json"),encoding="utf-8"))["root_sha256"])')"
          python -B tools/loom_release_candidate.py compare \
            candidate-jobs/candidate-A.zip candidate-jobs/candidate-B.zip \
            --public-root "$PUBLIC_ROOT" --native-subjects "$RUNNER_TEMP/native-subjects.json" \
            --output "$RUNNER_TEMP/reproducibility-receipt.json"
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          receipt=json.loads((root/"reproducibility-receipt.json").read_text(encoding="utf-8"))
          value={"schema_version":1,"status":"pre-installation",
                 "candidate_extracted_tree_sha256":receipt["candidate_a"]["installed_tree_sha256"],
                 "represented_installed_subjects":[],
                 "source_reproducibility_receipt_sha256":receipt["receipt_sha256"]}
          (root/"installed-runtime-evidence.json").write_text(
              json.dumps(value,sort_keys=True,separators=(",", ":"))+"\n",encoding="utf-8")
          PY
      - name: Verify v4 subject against actual release evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          EXACT_CUT="$RUNNER_TEMP/capability-reports/full-test-timings-ubuntu-latest-py3.11/exact-cut-ci.json"
          test -f "$EXACT_CUT"
          python -B tools/loom_release_subject_verify.py \
            release-assets/RELEASE-SUBJECT.json \
            --plugin "release-assets/loom-plugin-${RELEASE_TAG}.zip" \
            --commit "$GITHUB_SHA" --tag "$RELEASE_TAG" \
            --reproducibility-receipt "$RUNNER_TEMP/reproducibility-receipt.json" \
            --suite-certificate "$RUNNER_TEMP/full-suite.json" \
            --suite-policy contracts/release-suite-policy-v1.json \
            --promotion-policy .github/workflows/publish-release.yml \
            --exact-cut-receipt "$EXACT_CUT"
      - name: Build the bounded attestation subject
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          LOOM_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          assets = Path("release-assets")
          named = {
              "release_subject": assets / "RELEASE-SUBJECT.json",
              "canonical_plugin": assets / f"loom-plugin-{os.environ['RELEASE_TAG']}.zip",
              "reproduced_plugin": assets / f"loom-plugin-{os.environ['RELEASE_TAG']}-repro.zip",
              "cut_receipt": root / "cut-receipt.json",
              "suite_report": root / "full-suite.json",
              "rollback_report": root / "rollback.json",
              "reproducibility_receipt": root / "reproducibility-receipt.json",
              "candidate_admission_v2": root / "candidate-admission-v2.json",
              "candidate_suite_v2": root / "release-candidate-suite-v2.json",
              "authority_policy_v2": Path("contracts/release-authority-policy-v2.json"),
              "mechanism_manifest_v2": Path("contracts/release-qualification-manifest-v2.json"),
              "suite_policy": Path("contracts/release-suite-policy-v1.json"),
              "promotion_policy": Path(".github/workflows/publish-release.yml"),
              "exact_cut_receipt": root / "capability-reports" / "full-test-timings-ubuntu-latest-py3.11" / "exact-cut-ci.json",
              "installed_runtime_evidence": root / "installed-runtime-evidence.json",
              "codex_app_observation": assets / "CODEX-APP-EVIDENCE.json",
          }
          mechanism = Path(
              "contracts/release-mechanism-qualification-v2.json")
          if mechanism.is_file():
              named["mechanism_qualification_v2"] = mechanism
          for platform in (
                  "windows-x64", "windows-arm64", "macos-x64", "macos-arm64",
                  "linux-x64", "linux-arm64"):
              directory = root / "native" / platform
              binary = directory / ("loom-vault.exe" if platform.startswith("windows") else "loom-vault")
              named[f"{platform}.binary"] = binary
              named[f"{platform}.sbom"] = directory / "loom-vault.spdx.json"
              named[f"{platform}.provenance"] = directory / "provenance.json"
          rows = []
          for name, path in sorted(named.items()):
              raw = path.read_bytes()
              rows.append({"name": name, "bytes": len(raw),
                           "sha256": hashlib.sha256(raw).hexdigest()})
          value = {"schema_version": 1,
                   "repository": "https://github.com/saroo98/loom",
                   "commit": os.environ["LOOM_SOURCE_SHA"],
                   "tag": os.environ["RELEASE_TAG"], "artifacts": rows}
          (root / "release-evidence-subject.json").write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8")
          PY
      - id: attest-evidence-subject
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/release-evidence-subject.json
      - name: Verify attestation and compile the exact release passport
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-evidence-subject.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          LOOM_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh attestation verify "$RUNNER_TEMP/release-evidence-subject.json" \
            -R "${GITHUB_REPOSITORY}" --bundle "$ATTESTATION_BUNDLE" \
            > "$RUNNER_TEMP/attestation-verification.json"
          ASSET="release-assets/loom-plugin-${RELEASE_TAG}.zip"
          python -B tools/loom_release_certificate.py record-tag \
            --repository . --tag "$RELEASE_TAG" \
            --expected-commit "$LOOM_SOURCE_SHA" \
            --signer-identity "$RUNNER_TEMP/loom-release-allowed-signers" \
            --attestation "$ATTESTATION_BUNDLE" \
            --output "$RUNNER_TEMP/release-tag-evidence-v2.json"
          python -B tools/loom_release_certificate.py compile \
            --candidate "$RUNNER_TEMP/candidate-admission-v2.json" \
            --reproducibility "$RUNNER_TEMP/reproducibility-receipt.json" \
            --rollback "$RUNNER_TEMP/rollback.json" \
            --tag-evidence "$RUNNER_TEMP/release-tag-evidence-v2.json" \
            --output "$RUNNER_TEMP/release-certificate-v2.json"
          python -B tools/loom_release_certificate.py verify \
            --candidate "$RUNNER_TEMP/candidate-admission-v2.json" \
            --certificate "$RUNNER_TEMP/release-certificate-v2.json" \
            --expected-tag "$RELEASE_TAG" --asset "$ASSET"
          SOURCE_TREE="$(python -B -c 'import os,sys; sys.path.insert(0,"tools"); import loom_subject_identity as s; print(s.git_tree_inventory(".",os.environ["GITHUB_SHA"])["tree_sha256"])')"
          PUBLIC_ROOT="$(python -B -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"candidate-admission-v2.json"),encoding="utf-8"))["public_root_sha256"])')"
          POLICY="contracts/release-authority-policy-v2.json"
          MODE="$(python -B -c 'import json; print(json.load(open("contracts/release-authority-policy-v2.json",encoding="utf-8"))["authority_mode"])')"
          AUTHORITY=(--root . \
            --candidate "$RUNNER_TEMP/candidate-admission-v2.json" \
            --expected-commit "$LOOM_SOURCE_SHA" --expected-tree "$SOURCE_TREE" \
            --expected-public-root "$PUBLIC_ROOT" --policy "$POLICY")
          if test "$MODE" = certificate; then
            AUTHORITY+=(--mechanism contracts/release-mechanism-qualification-v2.json)
          else
            test "$MODE" = serial
          fi
          python -B tools/loom_release_authority.py release-authority \
            "${AUTHORITY[@]}" \
            --candidate-suite "$RUNNER_TEMP/release-candidate-suite-v2.json" \
            --release-certificate "$RUNNER_TEMP/release-certificate-v2.json" \
            --expected-tag "$RELEASE_TAG" --asset "$ASSET" \
            --output "$RUNNER_TEMP/release-authority-v2.json"
          python -B tools/loom_release_authority.py verify \
            "${AUTHORITY[@]}" \
            --candidate-suite "$RUNNER_TEMP/release-candidate-suite-v2.json" \
            --release-certificate "$RUNNER_TEMP/release-certificate-v2.json" \
            --release-authority "$RUNNER_TEMP/release-authority-v2.json" \
            --expected-tag "$RELEASE_TAG" --asset "$ASSET"
          export NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export EXPIRES="$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)"
          export WORKFLOW_DIGEST="$(sha256sum .github/workflows/release.yml | cut -d' ' -f1)"
          python -B - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          bundle = Path(os.environ["ATTESTATION_BUNDLE"]).read_bytes()
          value = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "job_id": "release",
              "runner": os.environ["RUNNER_NAME"],
              "workflow_digest": os.environ["WORKFLOW_DIGEST"],
              "attestation_sha256": hashlib.sha256(bundle).hexdigest(),
              "attestation_bundle": base64.b64encode(bundle).decode("ascii"),
              "issued_at": os.environ["NOW"], "verified_at": os.environ["NOW"],
              "expires_at": os.environ["EXPIRES"],
          }
          Path(os.environ["RUNNER_TEMP"], "ci-authority.json").write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8")
          PY
          ARGS=()
          for platform in windows-x64 windows-arm64 macos-x64 macos-arm64 linux-x64 linux-arm64; do
            directory="$RUNNER_TEMP/native/$platform"
            binary="loom-vault"
            [[ "$platform" == windows-* ]] && binary="loom-vault.exe"
            ARGS+=(--native-binary "$platform=$directory/$binary")
            ARGS+=(--native-sbom "$platform=$directory/loom-vault.spdx.json")
            ARGS+=(--native-provenance "$platform=$directory/provenance.json")
          done
          python -B tools/loom_release_passport.py \
            --subject release-assets/RELEASE-SUBJECT.json \
            --plugin "release-assets/loom-plugin-${RELEASE_TAG}.zip" \
            --reproduced-plugin "release-assets/loom-plugin-${RELEASE_TAG}-repro.zip" \
            --cut-receipt "$RUNNER_TEMP/cut-receipt.json" \
            --suite-report "$RUNNER_TEMP/full-suite.json" \
            --reproducibility-receipt "$RUNNER_TEMP/reproducibility-receipt.json" \
            --suite-policy contracts/release-suite-policy-v1.json \
            --promotion-policy .github/workflows/publish-release.yml \
            --exact-cut-receipt "$RUNNER_TEMP/capability-reports/full-test-timings-ubuntu-latest-py3.11/exact-cut-ci.json" \
            --rollback-report "$RUNNER_TEMP/rollback.json" \
            --ci-authority "$RUNNER_TEMP/ci-authority.json" \
            --codex-observation release-assets/CODEX-APP-EVIDENCE.json \
            --evaluation-epoch "$NOW" --output "$RUNNER_TEMP/release-passport" \
            --defer-checksum-manifest \
            "${ARGS[@]}"
          test -f "$RUNNER_TEMP/release-passport/RELEASE-READINESS.json"
          test -f "$RUNNER_TEMP/release-passport/RELEASE-EVIDENCE.json"
          test -f "$RUNNER_TEMP/release-passport/RELEASE-EVIDENCE-GRAPH.json"
          cp "$RUNNER_TEMP/release-evidence-subject.json" \
            "$RUNNER_TEMP/release-passport/RELEASE-EVIDENCE-SUBJECT.json"
          cp "$ATTESTATION_BUNDLE" \
            "$RUNNER_TEMP/release-passport/RELEASE-EVIDENCE-ATTESTATION.json"
      - name: Prepare exact release passport assets for protected staging
        shell: bash
        run: |
          cp "$RUNNER_TEMP/cut-receipt.json" "$RUNNER_TEMP/release-passport/cut-receipt.json"
          cp "$RUNNER_TEMP/full-suite.json" "$RUNNER_TEMP/release-passport/full-suite.json"
          cp "$RUNNER_TEMP/rollback.json" "$RUNNER_TEMP/release-passport/rollback.json"
          cp "$RUNNER_TEMP/clean-room.json" "$RUNNER_TEMP/release-passport/clean-room.json"
          cp "$RUNNER_TEMP/reproducibility-receipt.json" \
            "$RUNNER_TEMP/release-passport/reproducibility-receipt.json"
          cp "$RUNNER_TEMP/capability-reports/full-test-timings-ubuntu-latest-py3.11/exact-cut-ci.json" \
            "$RUNNER_TEMP/release-passport/exact-cut-ci.json"
          cp "$RUNNER_TEMP/installed-runtime-evidence.json" \
            "$RUNNER_TEMP/release-passport/installed-runtime-evidence.json"
          cp "$RUNNER_TEMP/quality-certificate/quality-matrix-certificate.json" \
            "$RUNNER_TEMP/release-passport/quality-matrix-certificate.json"
          cp "$RUNNER_TEMP/compatibility-certificate/compatibility-matrix-certificate.json" \
            "$RUNNER_TEMP/release-passport/compatibility-matrix-certificate.json"
          cp "$RUNNER_TEMP/candidate-admission-v2.json" \
            "$RUNNER_TEMP/release-passport/candidate-admission-v2.json"
          cp "$RUNNER_TEMP/release-candidate-suite-v2.json" \
            "$RUNNER_TEMP/release-passport/release-candidate-suite-v2.json"
          cp "$RUNNER_TEMP/release-tag-evidence-v2.json" \
            "$RUNNER_TEMP/release-passport/release-tag-evidence-v2.json"
          cp "$RUNNER_TEMP/release-certificate-v2.json" \
            "$RUNNER_TEMP/release-passport/release-certificate-v2.json"
          cp "$RUNNER_TEMP/release-authority-v2.json" \
            "$RUNNER_TEMP/release-passport/release-authority-v2.json"
          python -B tools/loom_release_promotion.py create-asset-manifest \
            --asset-root release-assets \
            --asset-root "$RUNNER_TEMP/release-passport" \
            --tag "$RELEASE_TAG" \
            --manifest "$RUNNER_TEMP/release-passport/SHA256SUMS"
      - name: Verify generated operational truth is current
        working-directory: tools
        run: python -B loom_readiness.py .. --check
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: ${{ runner.temp }}/release-passport/SHA256SUMS
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/release-passport/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-passport-${{ github.sha }}
          path: ${{ runner.temp }}/release-passport/
          retention-days: 1
          if-no-files-found: error

  stage-draft-assets:
    needs: release
    if: inputs.confirm_draft_only == 'DRAFT-ONLY'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: loom-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-passport-${{ github.sha }}
          path: release-passport
      - name: Revalidate and stage exact assets without overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')" = "true"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          while IFS= read -r asset; do
            name="$(basename "$asset")"
            local_digest="$(sha256sum "$asset" | cut -d' ' -f1)"
            grep -Fxq "$local_digest *$name" release-passport/SHA256SUMS
            gh attestation verify "$asset" -R "$GITHUB_REPOSITORY" > /dev/null
            remote_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq '.assets[] | select(.name == "'"$name"'") | .digest')"
            if test -z "$remote_digest"; then
              gh release upload "$RELEASE_TAG" "$asset"
            else
              test "$remote_digest" = "sha256:$local_digest"
            fi
            observed_digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq '.assets[] | select(.name == "'"$name"'") | .digest')"
            test "$observed_digest" = "sha256:$local_digest"
          done < <(find release-passport -maxdepth 1 -type f \
            ! -name SHA256SUMS -print | sort)
          gh release download "$RELEASE_TAG" \
            --dir "$RUNNER_TEMP/staged-release-assets"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/staged-release.json"
          python -B tools/loom_release_promotion.py verify-asset-set \
            "$RUNNER_TEMP/staged-release-assets" \
            --tag "$RELEASE_TAG" \
            --manifest release-passport/SHA256SUMS \
            --api-release "$RUNNER_TEMP/staged-release.json"
          test -z "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | select(.name == "SHA256SUMS") | .digest')"
          gh attestation verify release-passport/SHA256SUMS \
            -R "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$RELEASE_TAG" release-passport/SHA256SUMS
          manifest_digest="$(sha256sum release-passport/SHA256SUMS | cut -d' ' -f1)"
          observed_manifest="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | select(.name == "SHA256SUMS") | .digest')"
          test "$observed_manifest" = "sha256:$manifest_digest"
          cp release-passport/SHA256SUMS \
            "$RUNNER_TEMP/staged-release-assets/SHA256SUMS"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/final-staged-release.json"
          python -B tools/loom_release_promotion.py verify-asset-set \
            "$RUNNER_TEMP/staged-release-assets" \
            --tag "$RELEASE_TAG" \
            --manifest "$RUNNER_TEMP/staged-release-assets/SHA256SUMS" \
            --api-release "$RUNNER_TEMP/final-staged-release.json" \
            --manifest-published
          ASSET="$RUNNER_TEMP/staged-release-assets/loom-plugin-${RELEASE_TAG}.zip"
          python -B tools/loom_release_certificate.py verify \
            --candidate release-passport/candidate-admission-v2.json \
            --certificate release-passport/release-certificate-v2.json \
            --expected-tag "$RELEASE_TAG" --asset "$ASSET"
          SOURCE_TREE="$(python -B -c 'import os,sys; sys.path.insert(0,"tools"); import loom_subject_identity as s; print(s.git_tree_inventory(".",os.environ["GITHUB_SHA"])["tree_sha256"])')"
          PUBLIC_ROOT="$(python -B -c 'import json; print(json.load(open("release-passport/candidate-admission-v2.json",encoding="utf-8"))["public_root_sha256"])')"
          AUTHORITY=(--root . \
            --candidate release-passport/candidate-admission-v2.json \
            --expected-commit "$GITHUB_SHA" --expected-tree "$SOURCE_TREE" \
            --expected-public-root "$PUBLIC_ROOT" \
            --policy contracts/release-authority-policy-v2.json)
          MODE="$(python -B -c 'import json; print(json.load(open("contracts/release-authority-policy-v2.json",encoding="utf-8"))["authority_mode"])')"
          if test "$MODE" = certificate; then
            AUTHORITY+=(--mechanism contracts/release-mechanism-qualification-v2.json)
          else
            test "$MODE" = serial
          fi
          python -B tools/loom_release_authority.py verify \
            "${AUTHORITY[@]}" \
            --candidate-suite release-passport/release-candidate-suite-v2.json \
            --release-certificate release-passport/release-certificate-v2.json \
            --release-authority release-passport/release-authority-v2.json \
            --expected-tag "$RELEASE_TAG" --asset "$ASSET"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
