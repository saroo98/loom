name: qualify-release-mechanism-quality-v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualification-quality-v2
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  observe-fixed-mechanism-workload:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the closed fixed mechanism workload once
        shell: bash
        env:
          LOOM_REQUESTED_RUNNER_LABEL: ${{ matrix.os }}
          LOOM_WORKFLOW_PATH: .github/workflows/qualification-quality.yml
        run: |
          export LOOM_WORKFLOW_DIGEST="$(sha256sum .github/workflows/qualification-quality.yml | cut -d' ' -f1)"
          export LOOM_ACTION_MANIFEST_DIGEST="$(printf '%s\n' \
            'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' \
            'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' \
            'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' | sha256sum | cut -d' ' -f1)"
          test -f contracts/release-qualification-workload-policy-v2.json
          test -f contracts/release-qualification-manifest-v2.json
          python -B tools/loom_qualification_v2.py run-observation \
            --root . --consumer quality --source-commit "$GITHUB_SHA" \
            --output tools/qualification-observation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-quality-v2-${{ github.run_id }}-${{ matrix.os }}-py${{ matrix.python }}
          path: tools/qualification-observation.json
          retention-days: 90
          if-no-files-found: error

  certify-single-run-batch:
    needs: observe-fixed-mechanism-workload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: qualification-quality-v2-${{ github.run_id }}-*
          path: qualification-observations
          merge-multiple: false
      - name: Compile the exact 15-family quality batch
        shell: bash
        run: |
          mapfile -t OBSERVATIONS < <(find qualification-observations -name qualification-observation.json -type f | sort)
          test "${#OBSERVATIONS[@]}" -eq 15
          ARGS=(compile-batch --root . --consumer quality --output tools/qualification-quality-batch-v2.json)
          for observation in "${OBSERVATIONS[@]}"; do
            ARGS+=(--observation "$observation")
          done
          python -B tools/loom_qualification_v2.py "${ARGS[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-quality-batch-v2-${{ github.run_id }}
          path: tools/qualification-quality-batch-v2.json
          retention-days: 90
          if-no-files-found: error
