name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  truth-authority-shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Resolve the trusted-base corpus digest
        id: corpus
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CORPUS_PATH: benchmarks/truth-authority/corpus.json
        run: |
          if test -n "$BASE_SHA" &&
             git cat-file -e "$BASE_SHA:$CORPUS_PATH" 2>/dev/null; then
            git show "$BASE_SHA:$CORPUS_PATH" > "$RUNNER_TEMP/trusted-corpus.json"
            digest="$(python -B -c \
              'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' \
              "$RUNNER_TEMP/trusted-corpus.json")"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run locked shadow-promotion corpus
        if: steps.corpus.outputs.available == 'true'
        working-directory: tools
        run: >-
          python -B loom_truth_shadow.py
          --corpus ../benchmarks/truth-authority/corpus.json
          --registry ../contracts/truth-authorities-v1.json
          --expected-corpus-sha256 "${{ steps.corpus.outputs.sha256 }}"
          > truth-shadow-results.json
      - name: Run non-promoting bootstrap shadow
        if: steps.corpus.outputs.available != 'true'
        working-directory: tools
        run: >-
          python -B loom_truth_shadow.py
          --corpus ../benchmarks/truth-authority/corpus.json
          --registry ../contracts/truth-authorities-v1.json
          --shadow-bootstrap
          > truth-shadow-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: truth-authority-shadow
          path: tools/truth-shadow-results.json
          retention-days: 7
          if-no-files-found: error

  fast-pr-gate:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile production modules without bytecode
        working-directory: tools
        run: >-
          python -B -c "from pathlib import Path;
          files=sorted(Path('.').glob('loom_*.py'));
          [compile(path.read_text(encoding='utf-8'), str(path), 'exec') for path in files];
          print(f'compiled {len(files)} production modules in memory')"
      - name: Run bounded trust-critical gate
        working-directory: tools
        run: python -B loom_test.py fast --output fast-test-timings.json
      - name: Regenerate final inventory and require committed parity
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        working-directory: tools
        run: python -B loom_docs.py generate --root .. && git diff --exit-code -- ../docs/generated-evidence.json
      - name: Validate the fixed evidence score rubric
        working-directory: tools
        run: python -B loom_scorecard.py validate-rubric
      - name: Refuse stale generated release data
        working-directory: tools
        run: python -B loom_readiness.py .. --check
      - name: Enforce one version across every shipped surface
        working-directory: tools
        run: python -B loom_version.py ..
      - name: Run deterministic local performance micro-corpus
        working-directory: tools
        run: python -B loom_benchmark.py --iterations 3 --warmups 1 --output performance-micro.json
      - name: Run simulated adapter protocol conformance
        working-directory: tools
        run: python -B loom_adapter_conformance.py --root .. --output adapter-conformance.json
      - name: Verify successful fast-gate artifacts
        if: success()
        working-directory: tools
        shell: bash
        run: test -f fast-test-timings.json -a -f adapter-conformance.json -a -f performance-micro.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fast-test-timings-${{ matrix.os }}-py${{ matrix.python }}
          path: tools/fast-test-timings.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: adapter-conformance-${{ matrix.os }}-py${{ matrix.python }}
          path: tools/adapter-conformance.json
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: performance-micro-${{ matrix.os }}-py${{ matrix.python }}
          path: tools/performance-micro.json
          retention-days: 7
          if-no-files-found: ignore

  full-release-suite:
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile production modules without bytecode
        working-directory: tools
        run: >-
          python -B -c "from pathlib import Path;
          files=sorted(Path('.').glob('loom_*.py'));
          [compile(path.read_text(encoding='utf-8'), str(path), 'exec') for path in files];
          print(f'compiled {len(files)} production modules in memory')"
      - name: Audit network imports and literal subprocesses
        working-directory: tools
        run: python loom_privacy.py offline-audit .
      - name: Resolve candidate-suite authority route
        id: suite-route
        working-directory: tools
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          AUTHORITY_MODE="$(python -B -c 'import json; print(json.load(open("../contracts/release-authority-policy-v2.json",encoding="utf-8"))["authority_mode"])')"
          if test "$AUTHORITY_MODE" = serial; then
            EXECUTION=serial-shadow
          elif test "$AUTHORITY_MODE" = certificate && test "$EVENT_NAME" = workflow_dispatch; then
            EXECUTION=serial-shadow
          elif test "$AUTHORITY_MODE" = certificate && test "$EVENT_NAME" = push; then
            EXECUTION=certificate
          else
            echo "candidate-suite authority route is unsupported" >&2
            exit 1
          fi
          echo "execution=$EXECUTION" >> "$GITHUB_OUTPUT"
      - name: Build and serially verify the exact public cut
        if: steps.suite-route.outputs.execution == 'serial-shadow'
        working-directory: tools
        shell: bash
        env:
          LOOM_REQUESTED_RUNNER_LABEL: ${{ matrix.os }}
          LOOM_WORKFLOW_PATH: .github/workflows/quality.yml
        run: |
          export LOOM_WORKFLOW_DIGEST="$(sha256sum ../.github/workflows/quality.yml | cut -d' ' -f1)"
          export LOOM_ACTION_MANIFEST_DIGEST="$(printf '%s\n' \
            'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' \
            'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' \
            'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' | sha256sum | cut -d' ' -f1)"
          ARGS=(.. "${{ runner.temp }}/loom-public-cut" --forbidden-token "loom-ci-${{ github.sha }}" --output exact-cut-ci.json --suite-output full-test-timings.json --failure-diagnostic-output serial-failure-diagnostic.json --progress-diagnostic-output serial-progress-diagnostic.json)
          python -B loom_exact_cut_ci.py "${ARGS[@]}"
      - name: Build and statically verify the exact public cut
        if: steps.suite-route.outputs.execution == 'certificate'
        working-directory: tools
        shell: bash
        env:
          LOOM_REQUESTED_RUNNER_LABEL: ${{ matrix.os }}
          LOOM_WORKFLOW_PATH: .github/workflows/quality.yml
        run: |
          export LOOM_WORKFLOW_DIGEST="$(sha256sum ../.github/workflows/quality.yml | cut -d' ' -f1)"
          export LOOM_ACTION_MANIFEST_DIGEST="$(printf '%s\n' \
            'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' \
            'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' \
            'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' | sha256sum | cut -d' ' -f1)"
          python -B loom_exact_cut_ci.py .. "${{ runner.temp }}/loom-public-cut" \
            --forbidden-token "loom-ci-${{ github.sha }}" \
            --output exact-cut-ci.json --static-only
      - name: Run the exact isolated sharded candidate and compare to serial
        if: steps.suite-route.outputs.execution == 'serial-shadow'
        working-directory: tools
        shell: bash
        run: |
          SOURCE_TREE="$(python -B -c 'import os; import loom_subject_identity as s; print(s.git_tree_inventory("..", os.environ["GITHUB_SHA"])["tree_sha256"])')"
          ARGS=(--cut "${{ runner.temp }}/loom-public-cut" --test-root "${{ runner.temp }}/loom-public-cut/tools" --exact-receipt exact-cut-ci.json --policy ../contracts/release-suite-policy-v1.json --timing-profile ../contracts/release-suite-timing-profile-v1.json --source-tree-sha256 "$SOURCE_TREE" --output-root suite-shadow)
          python -B loom_suite_certificate.py shadow-cell "${ARGS[@]}" \
            --serial-report full-test-timings.json
      - name: Run the authoritative isolated certificate cell once
        if: steps.suite-route.outputs.execution == 'certificate'
        working-directory: tools
        shell: bash
        run: |
          python -B - "${{ runner.temp }}/release-suite-certificate-policy-v1.json" <<'PY'
          import json
          import pathlib
          import sys
          import loom_reliability
          import loom_suite_plan

          source = json.load(open(
              "../contracts/release-suite-policy-v1.json", encoding="utf-8"))
          source.pop("policy_sha256", None)
          source["authority_mode"] = "certificate"
          loom_reliability.atomic_write_json(
              pathlib.Path(sys.argv[1]), loom_suite_plan.seal_policy(source))
          PY
          SOURCE_TREE="$(python -B -c 'import os; import loom_subject_identity as s; print(s.git_tree_inventory("..", os.environ["GITHUB_SHA"])["tree_sha256"])')"
          ARGS=(--cut "${{ runner.temp }}/loom-public-cut" --test-root "${{ runner.temp }}/loom-public-cut/tools" --exact-receipt exact-cut-ci.json --policy "${{ runner.temp }}/release-suite-certificate-policy-v1.json" --timing-profile ../contracts/release-suite-timing-profile-v1.json --source-tree-sha256 "$SOURCE_TREE" --output-root suite-shadow)
          python -B loom_suite_certificate.py run-cell "${ARGS[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.suite-route.outputs.execution == 'serial-shadow'
        with:
          name: full-test-timings-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            tools/exact-cut-ci.json
            tools/full-test-timings.json
            tools/serial-failure-diagnostic.json
            tools/serial-progress-diagnostic.json
            tools/suite-shadow/workers/*/worker-receipt.json
            tools/suite-shadow/workers/*/failure-diagnostic.json
            tools/suite-shadow/cell-certificate.json
            tools/suite-shadow/shadow-comparison.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.suite-route.outputs.execution == 'certificate'
        with:
          name: full-test-timings-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            tools/exact-cut-ci.json
            tools/suite-shadow/workers/*/worker-receipt.json
            tools/suite-shadow/workers/*/failure-diagnostic.json
            tools/suite-shadow/cell-certificate.json
          retention-days: 7
          if-no-files-found: error

  aggregate-capability-coverage:
    if: github.event_name != 'pull_request'
    needs: full-release-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve candidate-suite authority route
        id: suite-route
        working-directory: tools
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          AUTHORITY_MODE="$(python -B -c 'import json; print(json.load(open("../contracts/release-authority-policy-v2.json",encoding="utf-8"))["authority_mode"])')"
          if test "$AUTHORITY_MODE" = serial; then
            EXECUTION=serial-shadow
          elif test "$AUTHORITY_MODE" = certificate && test "$EVENT_NAME" = workflow_dispatch; then
            EXECUTION=serial-shadow
          elif test "$AUTHORITY_MODE" = certificate && test "$EVENT_NAME" = push; then
            EXECUTION=certificate
          else
            echo "candidate-suite authority route is unsupported" >&2
            exit 1
          fi
          echo "execution=$EXECUTION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: full-test-timings-*
          path: suite-reports
          merge-multiple: false
      - name: Require every skipped capability to pass in another bound job
        if: steps.suite-route.outputs.execution == 'serial-shadow'
        working-directory: tools
        shell: bash
        run: |
          python -B loom_capability.py ../suite-reports/*/full-test-timings.json
      - name: Compile exact-candidate quality matrix certificate
        working-directory: tools
        shell: bash
        env:
          EXECUTION: ${{ steps.suite-route.outputs.execution }}
        run: |
          mapfile -t CERTS < <(find ../suite-reports -name cell-certificate.json -type f | sort)
          SHADOW_OK=1
          EXPECTED_COMPARISONS=0
          if test "$EXECUTION" = serial-shadow; then
            EXPECTED_COMPARISONS=15
          else
            test "$EXECUTION" = certificate
          fi
          mapfile -t COMPARISONS < <(find ../suite-reports -name shadow-comparison.json -type f | sort)
          test "${#COMPARISONS[@]}" -eq "$EXPECTED_COMPARISONS" || SHADOW_OK=0
          for comparison in "${COMPARISONS[@]}"; do
            if ! test "$(python -B -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["status"])' "$comparison")" = matched; then
              SHADOW_OK=0
            fi
          done
          if test "${#CERTS[@]}" -eq 15 && test "$SHADOW_OK" -eq 1; then
            ARGS=()
            for certificate in "${CERTS[@]}"; do
              environment="$(python -B -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["environment_sha256"])' "$certificate")"
              ARGS+=(--cell-certificate "$certificate" --required-environment "$environment")
            done
            python -B loom_suite_certificate.py matrix --consumer quality \
              "${ARGS[@]}" --output quality-matrix-certificate.json
          else
            python -B -c 'import json; json.dump({"schema_version":1,"status":"mismatched","primary_reason":"INVENTORY_MISMATCH"}, open("quality-matrix-certificate.json","w",encoding="utf-8"), sort_keys=True)'
            false
          fi
      - name: Verify certificate authority against current quality families
        if: steps.suite-route.outputs.execution == 'certificate'
        working-directory: tools
        shell: bash
        run: |
          python -B - quality-matrix-certificate.json current-quality-families.json <<'PY'
          import json
          import sys
          import loom_qualification_v2

          matrix = json.load(open(sys.argv[1], encoding="utf-8"))
          record = json.load(open(
              "../contracts/release-mechanism-qualification-v2.json",
              encoding="utf-8"))
          current = [
              loom_qualification_v2.family_identity(row)
              for row in record["families"]
              if row["consumer"] != "quality"
          ]
          current.extend(
              loom_qualification_v2.family_identity(
                  loom_qualification_v2._family(cell["environment"], "quality"))
              for cell in matrix["cells"])
          with open(sys.argv[2], "w", encoding="utf-8", newline="\n") as stream:
              json.dump(current, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY
          python -B loom_qualification_v2.py verify-mechanism --root .. \
            --qualification ../contracts/release-mechanism-qualification-v2.json \
            --current-families current-quality-families.json \
            --policy ../contracts/release-authority-policy-v2.json
      - name: Seal the exact quality candidate evidence bundle
        if: steps.suite-route.outputs.execution == 'serial-shadow'
        working-directory: tools
        shell: bash
        run: |
          mapfile -t RECEIPTS < <(find ../suite-reports -name exact-cut-ci.json -type f | sort)
          test "${#RECEIPTS[@]}" -eq 15
          ARGS=(compile-candidate-bundle --root .. --consumer quality \
            --matrix quality-matrix-certificate.json \
            --output quality-candidate-bundle-v2.json)
          for receipt in "${RECEIPTS[@]}"; do
            ARGS+=(--exact-receipt "$receipt")
          done
          python -B loom_qualification_v2.py "${ARGS[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-matrix-certificate
          path: tools/quality-matrix-certificate.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.suite-route.outputs.execution == 'serial-shadow'
        with:
          name: quality-candidate-evidence-v2
          path: |
            tools/quality-matrix-certificate.json
            tools/quality-candidate-bundle-v2.json
          retention-days: 7
          if-no-files-found: error

  loom-11-vault-and-upgrade:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Use the repository-pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify Rust formatting and deny Clippy warnings
        run: cargo fmt --manifest-path vault-helper/Cargo.toml -- --check
      - name: Compile and lint the cryptographic helper
        run: cargo clippy --locked --manifest-path vault-helper/Cargo.toml --all-targets -- -D warnings
      - name: Exercise Loom 1.1 vault, migration, update, transfer, and plugin contracts
        working-directory: tools
        run: >-
          python -B -m unittest
          test_loom_v11_contracts.py
          test_loom_vault_v11.py
          test_loom_crypto_v11.py
          test_loom_migration_v11.py
          test_loom_merge_v11.py
          test_loom_update_v11.py
          test_loom_transfer_v11.py
          test_loom_plugin_adapters_v11.py
          test_adapter_protocol_v2.py
          test_adapter_conformance_v2.py
          test_scorecard_phase6.py
          test_loom_owner_v11.py
          test_loom_release_sign_v11.py
          test_owner_learning_phase2.py
