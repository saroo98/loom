name: native-compatibility

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-helpers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux-x64}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64}
          - {runner: windows-2025, platform: windows-x64}
          - {runner: windows-11-arm, platform: windows-arm64}
          - {runner: macos-15-intel, platform: macos-x64}
          - {runner: macos-15, platform: macos-arm64}
    uses: ./.github/workflows/build-helper.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}

  python-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and serially verify exact public cut
        working-directory: tools
        shell: bash
        env:
          LOOM_REQUESTED_RUNNER_LABEL: ${{ matrix.os }}
          LOOM_WORKFLOW_PATH: .github/workflows/compatibility.yml
        run: |
          export LOOM_WORKFLOW_DIGEST="$(sha256sum ../.github/workflows/compatibility.yml | cut -d' ' -f1)"
          export LOOM_ACTION_MANIFEST_DIGEST="$(printf '%s\n' \
            'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' \
            'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' \
            'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' | sha256sum | cut -d' ' -f1)"
          MODE="$(python -B -c 'import json; print(json.load(open("../contracts/release-suite-policy-v1.json",encoding="utf-8"))["authority_mode"])')"
          ARGS=(.. "${{ runner.temp }}/loom-public-cut" --output exact-cut-ci.json)
          if test "$MODE" = serial; then
            ARGS+=(--suite-output full-test-timings.json)
          else
            ARGS+=(--static-only)
          fi
          python -B loom_exact_cut_ci.py "${ARGS[@]}"
      - name: Run isolated sharded shadow or certificate authority
        working-directory: tools
        shell: bash
        run: |
          SOURCE_TREE="$(python -B -c 'import os; import loom_subject_identity as s; print(s.git_tree_inventory("..", os.environ["GITHUB_SHA"])["tree_sha256"])')"
          MODE="$(python -B -c 'import json; print(json.load(open("../contracts/release-suite-policy-v1.json",encoding="utf-8"))["authority_mode"])')"
          ARGS=(--cut "${{ runner.temp }}/loom-public-cut" --test-root "${{ runner.temp }}/loom-public-cut/tools" --exact-receipt exact-cut-ci.json --policy ../contracts/release-suite-policy-v1.json --timing-profile ../contracts/release-suite-timing-profile-v1.json --source-tree-sha256 "$SOURCE_TREE" --output-root suite-shadow)
          if test "$MODE" = serial; then
            python -B loom_suite_certificate.py shadow-cell "${ARGS[@]}" \
              --serial-report full-test-timings.json
          else
            python -B loom_suite_certificate.py run-cell "${ARGS[@]}"
          fi
      - name: Reuse exact cell evidence for the clean-room boundary
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.11'
        working-directory: tools
        shell: bash
        run: |
          MODE="$(python -B -c 'import json; print(json.load(open("../contracts/release-suite-policy-v1.json",encoding="utf-8"))["authority_mode"])')"
          ARGS=("${{ runner.temp }}/loom-public-cut" --policy ../contracts/release-suite-policy-v1.json --output clean-room.json)
          if test "$MODE" = serial; then
            ARGS+=(--serial-suite full-test-timings.json)
          else
            ARGS+=(--suite-certificate suite-shadow/cell-certificate.json)
          fi
          python -B loom_clean_room.py "${ARGS[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-suite-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            tools/exact-cut-ci.json
            tools/full-test-timings.json
            tools/clean-room.json
            tools/suite-shadow/cell-certificate.json
            tools/suite-shadow/shadow-comparison.json
          retention-days: 7
          if-no-files-found: warn

  aggregate-suite-shadow:
    needs: [native-helpers, python-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compatibility-suite-*
          path: compatibility-reports
          merge-multiple: false
      - name: Compile non-authoritative compatibility matrix certificate
        working-directory: tools
        shell: bash
        run: |
          mapfile -t CERTS < <(find ../compatibility-reports -name cell-certificate.json -type f | sort)
          MODE="$(python -B -c 'import json; print(json.load(open("../contracts/release-suite-policy-v1.json",encoding="utf-8"))["authority_mode"])')"
          SHADOW_OK=1
          if test "$MODE" = serial; then
            mapfile -t COMPARISONS < <(find ../compatibility-reports -name shadow-comparison.json -type f | sort)
            test "${#COMPARISONS[@]}" -eq 15 || SHADOW_OK=0
            for comparison in "${COMPARISONS[@]}"; do
              if ! test "$(python -B -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["status"])' "$comparison")" = matched; then
                SHADOW_OK=0
              fi
            done
          fi
          if test "${#CERTS[@]}" -eq 15 && test "$SHADOW_OK" -eq 1; then
            ARGS=()
            for certificate in "${CERTS[@]}"; do
              environment="$(python -B -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["environment_sha256"])' "$certificate")"
              ARGS+=(--cell-certificate "$certificate" --required-environment "$environment")
            done
            python -B loom_suite_certificate.py matrix --consumer compatibility \
              "${ARGS[@]}" --output compatibility-matrix-certificate.json
          else
            python -B -c 'import json; json.dump({"schema_version":1,"status":"mismatched","primary_reason":"INVENTORY_MISMATCH"}, open("compatibility-matrix-certificate.json","w",encoding="utf-8"), sort_keys=True)'
            test "$MODE" = serial
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-matrix-certificate
          path: tools/compatibility-matrix-certificate.json
          retention-days: 7
          if-no-files-found: error
