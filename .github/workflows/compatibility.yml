name: native-compatibility

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-helpers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux-x64}
          - {runner: ubuntu-24.04-arm, platform: linux-arm64}
          - {runner: windows-2025, platform: windows-x64}
          - {runner: windows-11-arm, platform: windows-arm64}
          - {runner: macos-15-intel, platform: macos-x64}
          - {runner: macos-15, platform: macos-arm64}
    uses: ./.github/workflows/build-helper.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}

  python-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Resolve candidate-suite authority route
        id: suite-route
        working-directory: tools
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          AUTHORITY_MODE="$(python -B -c 'import json; print(json.load(open("../contracts/release-authority-policy-v2.json",encoding="utf-8"))["authority_mode"])')"
          if test "$AUTHORITY_MODE" = serial; then
            EXECUTION=serial-shadow
          elif test "$AUTHORITY_MODE" = certificate && test "$EVENT_NAME" = workflow_dispatch; then
            EXECUTION=serial-shadow
          elif test "$AUTHORITY_MODE" = certificate && test "$EVENT_NAME" = push; then
            EXECUTION=certificate
          elif test "$AUTHORITY_MODE" = certificate && test "$EVENT_NAME" = schedule; then
            EXECUTION=certificate
          else
            echo "candidate-suite authority route is unsupported" >&2
            exit 1
          fi
          echo "execution=$EXECUTION" >> "$GITHUB_OUTPUT"
      - name: Build and serially verify exact public cut
        if: steps.suite-route.outputs.execution == 'serial-shadow'
        working-directory: tools
        shell: bash
        env:
          LOOM_REQUESTED_RUNNER_LABEL: ${{ matrix.os }}
          LOOM_WORKFLOW_PATH: .github/workflows/compatibility.yml
        run: |
          export LOOM_WORKFLOW_DIGEST="$(sha256sum ../.github/workflows/compatibility.yml | cut -d' ' -f1)"
          export LOOM_ACTION_MANIFEST_DIGEST="$(printf '%s\n' \
            'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' \
            'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' \
            'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' | sha256sum | cut -d' ' -f1)"
          ARGS=(.. "${{ runner.temp }}/loom-public-cut" --output exact-cut-ci.json --suite-output full-test-timings.json --failure-diagnostic-output serial-failure-diagnostic.json --progress-diagnostic-output serial-progress-diagnostic.json)
          python -B loom_exact_cut_ci.py "${ARGS[@]}"
      - name: Build and statically verify exact public cut
        if: steps.suite-route.outputs.execution == 'certificate'
        working-directory: tools
        shell: bash
        env:
          LOOM_REQUESTED_RUNNER_LABEL: ${{ matrix.os }}
          LOOM_WORKFLOW_PATH: .github/workflows/compatibility.yml
        run: |
          export LOOM_WORKFLOW_DIGEST="$(sha256sum ../.github/workflows/compatibility.yml | cut -d' ' -f1)"
          export LOOM_ACTION_MANIFEST_DIGEST="$(printf '%s\n' \
            'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' \
            'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' \
            'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' | sha256sum | cut -d' ' -f1)"
          python -B loom_exact_cut_ci.py .. "${{ runner.temp }}/loom-public-cut" \
            --output exact-cut-ci.json --static-only
      - name: Run the exact isolated sharded candidate and compare to serial
        if: steps.suite-route.outputs.execution == 'serial-shadow'
        working-directory: tools
        shell: bash
        run: |
          SOURCE_TREE="$(python -B -c 'import os; import loom_subject_identity as s; print(s.git_tree_inventory("..", os.environ["GITHUB_SHA"])["tree_sha256"])')"
          ARGS=(--cut "${{ runner.temp }}/loom-public-cut" --test-root "${{ runner.temp }}/loom-public-cut/tools" --exact-receipt exact-cut-ci.json --policy ../contracts/release-suite-policy-v1.json --timing-profile ../contracts/release-suite-timing-profile-v1.json --source-tree-sha256 "$SOURCE_TREE" --output-root suite-shadow)
          python -B loom_suite_certificate.py shadow-cell "${ARGS[@]}" \
            --serial-report full-test-timings.json
      - name: Run the authoritative isolated certificate cell once
        if: steps.suite-route.outputs.execution == 'certificate'
        working-directory: tools
        shell: bash
        run: |
          python -B - "${{ runner.temp }}/release-suite-certificate-policy-v1.json" <<'PY'
          import json
          import pathlib
          import sys
          import loom_reliability
          import loom_suite_plan

          source = json.load(open(
              "../contracts/release-suite-policy-v1.json", encoding="utf-8"))
          source.pop("policy_sha256", None)
          source["authority_mode"] = "certificate"
          loom_reliability.atomic_write_json(
              pathlib.Path(sys.argv[1]), loom_suite_plan.seal_policy(source))
          PY
          SOURCE_TREE="$(python -B -c 'import os; import loom_subject_identity as s; print(s.git_tree_inventory("..", os.environ["GITHUB_SHA"])["tree_sha256"])')"
          ARGS=(--cut "${{ runner.temp }}/loom-public-cut" --test-root "${{ runner.temp }}/loom-public-cut/tools" --exact-receipt exact-cut-ci.json --policy "${{ runner.temp }}/release-suite-certificate-policy-v1.json" --timing-profile ../contracts/release-suite-timing-profile-v1.json --source-tree-sha256 "$SOURCE_TREE" --output-root suite-shadow)
          python -B loom_suite_certificate.py run-cell "${ARGS[@]}"
      - name: Reuse exact cell evidence for the clean-room boundary
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.11'
        working-directory: tools
        shell: bash
        env:
          EXECUTION: ${{ steps.suite-route.outputs.execution }}
        run: |
          ARGS=("${{ runner.temp }}/loom-public-cut" --output clean-room.json)
          if test "$EXECUTION" = serial-shadow; then
            ARGS+=(--policy ../contracts/release-suite-policy-v1.json --serial-suite full-test-timings.json)
          else
            test "$EXECUTION" = certificate
            ARGS+=(--policy "${{ runner.temp }}/release-suite-certificate-policy-v1.json" --suite-certificate suite-shadow/cell-certificate.json)
          fi
          python -B loom_clean_room.py "${ARGS[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.suite-route.outputs.execution == 'serial-shadow'
        with:
          name: compatibility-suite-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            tools/exact-cut-ci.json
            tools/full-test-timings.json
            tools/serial-failure-diagnostic.json
            tools/serial-progress-diagnostic.json
            tools/clean-room.json
            tools/suite-shadow/workers/*/worker-receipt.json
            tools/suite-shadow/workers/*/failure-diagnostic.json
            tools/suite-shadow/cell-certificate.json
            tools/suite-shadow/shadow-comparison.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.suite-route.outputs.execution == 'certificate'
        with:
          name: compatibility-suite-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            tools/exact-cut-ci.json
            tools/clean-room.json
            tools/suite-shadow/workers/*/worker-receipt.json
            tools/suite-shadow/workers/*/failure-diagnostic.json
            tools/suite-shadow/cell-certificate.json
          retention-days: 7
          if-no-files-found: warn

  aggregate-suite-shadow:
    needs: [native-helpers, python-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve candidate-suite authority route
        id: suite-route
        working-directory: tools
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          AUTHORITY_MODE="$(python -B -c 'import json; print(json.load(open("../contracts/release-authority-policy-v2.json",encoding="utf-8"))["authority_mode"])')"
          if test "$AUTHORITY_MODE" = serial; then
            EXECUTION=serial-shadow
          elif test "$AUTHORITY_MODE" = certificate && test "$EVENT_NAME" = workflow_dispatch; then
            EXECUTION=serial-shadow
          elif test "$AUTHORITY_MODE" = certificate && test "$EVENT_NAME" = push; then
            EXECUTION=certificate
          elif test "$AUTHORITY_MODE" = certificate && test "$EVENT_NAME" = schedule; then
            EXECUTION=certificate
          else
            echo "candidate-suite authority route is unsupported" >&2
            exit 1
          fi
          echo "execution=$EXECUTION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compatibility-suite-*
          path: compatibility-reports
          merge-multiple: false
      - name: Compile exact-candidate compatibility matrix certificate
        working-directory: tools
        shell: bash
        env:
          EXECUTION: ${{ steps.suite-route.outputs.execution }}
        run: |
          mapfile -t CERTS < <(find ../compatibility-reports -name cell-certificate.json -type f | sort)
          SHADOW_OK=1
          EXPECTED_COMPARISONS=0
          if test "$EXECUTION" = serial-shadow; then
            EXPECTED_COMPARISONS=15
          else
            test "$EXECUTION" = certificate
          fi
          mapfile -t COMPARISONS < <(find ../compatibility-reports -name shadow-comparison.json -type f | sort)
          test "${#COMPARISONS[@]}" -eq "$EXPECTED_COMPARISONS" || SHADOW_OK=0
          for comparison in "${COMPARISONS[@]}"; do
            if ! test "$(python -B -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["status"])' "$comparison")" = matched; then
              SHADOW_OK=0
            fi
          done
          if test "${#CERTS[@]}" -eq 15 && test "$SHADOW_OK" -eq 1; then
            ARGS=()
            for certificate in "${CERTS[@]}"; do
              environment="$(python -B -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["environment_sha256"])' "$certificate")"
              ARGS+=(--cell-certificate "$certificate" --required-environment "$environment")
            done
            python -B loom_suite_certificate.py matrix --consumer compatibility \
              "${ARGS[@]}" --output compatibility-matrix-certificate.json
          else
            python -B -c 'import json; json.dump({"schema_version":1,"status":"mismatched","primary_reason":"INVENTORY_MISMATCH"}, open("compatibility-matrix-certificate.json","w",encoding="utf-8"), sort_keys=True)'
            false
          fi
      - name: Verify certificate authority against current compatibility families
        if: steps.suite-route.outputs.execution == 'certificate'
        working-directory: tools
        shell: bash
        run: |
          python -B - compatibility-matrix-certificate.json current-compatibility-families.json <<'PY'
          import json
          import sys
          import loom_qualification_v2

          matrix = json.load(open(sys.argv[1], encoding="utf-8"))
          record = json.load(open(
              "../contracts/release-mechanism-qualification-v2.json",
              encoding="utf-8"))
          current = [
              loom_qualification_v2.family_identity(row)
              for row in record["families"]
              if row["consumer"] != "compatibility"
          ]
          current.extend(
              loom_qualification_v2.family_identity(
                  loom_qualification_v2._family(
                      cell["environment"], "compatibility"))
              for cell in matrix["cells"])
          with open(sys.argv[2], "w", encoding="utf-8", newline="\n") as stream:
              json.dump(current, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PY
          python -B loom_qualification_v2.py verify-mechanism --root .. \
            --qualification ../contracts/release-mechanism-qualification-v2.json \
            --current-families current-compatibility-families.json \
            --policy ../contracts/release-authority-policy-v2.json
      - name: Seal the exact compatibility candidate evidence bundle
        if: steps.suite-route.outputs.execution == 'serial-shadow'
        working-directory: tools
        shell: bash
        run: |
          mapfile -t RECEIPTS < <(find ../compatibility-reports -name exact-cut-ci.json -type f | sort)
          mapfile -t CLEAN_ROOMS < <(find ../compatibility-reports -name clean-room.json -type f | sort)
          test "${#RECEIPTS[@]}" -eq 15
          test "${#CLEAN_ROOMS[@]}" -eq 1
          ARGS=(compile-candidate-bundle --root .. --consumer compatibility \
            --matrix compatibility-matrix-certificate.json \
            --clean-room "${CLEAN_ROOMS[0]}" \
            --output compatibility-candidate-bundle-v2.json)
          for receipt in "${RECEIPTS[@]}"; do
            ARGS+=(--exact-receipt "$receipt")
          done
          python -B loom_qualification_v2.py "${ARGS[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-matrix-certificate
          path: tools/compatibility-matrix-certificate.json
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.suite-route.outputs.execution == 'serial-shadow'
        with:
          name: compatibility-candidate-evidence-v2
          path: |
            tools/compatibility-matrix-certificate.json
            tools/compatibility-candidate-bundle-v2.json
          retention-days: 7
          if-no-files-found: error
