name: publish-verified-same-byte-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified draft tag
        required: true
        type: string
      confirm_publish:
        description: Type PUBLISH-SAME-BYTES
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: loom-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm_publish == 'PUBLISH-SAME-BYTES'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: loom-release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify signed tag, immutable-release policy, and draft state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          LOOM_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.LOOM_RELEASE_SIGNING_PUBLIC_KEY }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" != "v1.8.30"
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          [[ "$LOOM_RELEASE_SIGNING_PUBLIC_KEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,3}$ ]]
          printf 'loom-release@users.noreply.github.com %s\n' "$LOOM_RELEASE_SIGNING_PUBLIC_KEY" > "$RUNNER_TEMP/allowed-signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed-signers"
          git verify-tag "$RELEASE_TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')" = "true"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          gh release download "$RELEASE_TAG" --dir release-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/draft-release.json"
      - name: Verify all draft authority and exact asset evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          python -B tools/loom_release_promotion.py verify-asset-set release-assets \
            --tag "$RELEASE_TAG" \
            --manifest release-assets/SHA256SUMS \
            --api-release "$RUNNER_TEMP/draft-release.json" \
            --manifest-published
          cd release-assets
          sha256sum --check SHA256SUMS
          cd ..
          ASSET="release-assets/loom-plugin-${RELEASE_TAG}.zip"
          python -B tools/loom_release_verify.py "$ASSET"
          python -B tools/loom_release_subject_verify.py release-assets/RELEASE-SUBJECT.json \
            --plugin "$ASSET" --commit "$GITHUB_SHA" --tag "$RELEASE_TAG" \
            --reproducibility-receipt release-assets/reproducibility-receipt.json \
            --suite-certificate release-assets/full-suite.json \
            --suite-policy contracts/release-suite-policy-v1.json \
            --promotion-policy .github/workflows/publish-release.yml \
            --exact-cut-receipt release-assets/exact-cut-ci.json
          MODE="$(python -B -c 'import json; print(json.load(open("contracts/release-suite-policy-v1.json",encoding="utf-8"))["authority_mode"])')"
          PUBLIC_ROOT="$(python -B -c 'import json; print(json.load(open("release-assets/cut-receipt.json",encoding="utf-8"))["root_sha256"])')"
          python -B tools/loom_suite_certificate.py verify release-assets/quality-matrix-certificate.json
          python -B tools/loom_suite_certificate.py verify release-assets/compatibility-matrix-certificate.json
          python -B tools/loom_release_suite.py --verify release-assets/full-suite.json \
            --policy contracts/release-suite-policy-v1.json --commit "$GITHUB_SHA" \
            --public-root "$PUBLIC_ROOT"
          if test "$MODE" = serial; then
            test ! -f contracts/release-suite-qualification-v1.json
          else
            python -B tools/loom_suite_certificate.py verify-qualification \
              --qualification contracts/release-suite-qualification-v1.json \
              --policy contracts/release-suite-policy-v1.json \
              --matrix-certificate release-assets/quality-matrix-certificate.json \
              --matrix-certificate release-assets/compatibility-matrix-certificate.json
          fi
          python -B -c 'import json; assert json.load(open("release-assets/RELEASE-READINESS.json", encoding="utf-8"))["status"] == "ready"'
          python -B -c 'import json; assert json.load(open("release-assets/rollback.json", encoding="utf-8"))["status"] == "passed"'
          test "$(find release-assets -name 'native-evidence-*.zip' -type f | wc -l)" -eq 6
          gh attestation verify "$ASSET" -R "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/attestation.json"
          gh attestation verify release-assets/SHA256SUMS \
            -R "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/checksums-attestation.json"
          gh attestation verify release-assets/RELEASE-EVIDENCE-SUBJECT.json \
            -R "$GITHUB_REPOSITORY" \
            --bundle release-assets/RELEASE-EVIDENCE-ATTESTATION.json \
            > "$RUNNER_TEMP/evidence-subject-attestation.json"
          python -B tools/loom_release_certificate.py record-tag \
            --repository . --tag "$RELEASE_TAG" \
            --expected-commit "$GITHUB_SHA" \
            --signer-identity "$RUNNER_TEMP/allowed-signers" \
            --attestation release-assets/RELEASE-EVIDENCE-ATTESTATION.json \
            --output "$RUNNER_TEMP/recomputed-release-tag-evidence-v2.json"
          cmp "$RUNNER_TEMP/recomputed-release-tag-evidence-v2.json" \
            release-assets/release-tag-evidence-v2.json
          EXPECTED="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          API_DIGEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name == "loom-plugin-'"$RELEASE_TAG"'.zip") | .digest')"
          python -B - "$EXPECTED" "$API_DIGEST" <<'PY'
          import json,sys
          fields = {
              "signed_tag_verified": True, "passport_verified": True,
              "matrix_certificate_verified": True, "native_evidence_verified": True,
              "rollback_verified": True, "attestation_verified": True,
              "expected_sha256": sys.argv[1], "release_asset_sha256": sys.argv[2],
          }
          json.dump(fields, open("promotion-gate.json", "w", encoding="utf-8"),
                    sort_keys=True, separators=(",", ":"))
          PY
          python -B tools/loom_release_promotion.py verify-draft "$ASSET" \
            --gate promotion-gate.json --output draft-promotion-receipt.json
          CANDIDATE="release-assets/candidate-admission-v2.json"
          SOURCE_TREE="$(python -B -c 'import os,sys; sys.path.insert(0,"tools"); import loom_subject_identity as s; print(s.git_tree_inventory(".",os.environ["GITHUB_SHA"])["tree_sha256"])')"
          PUBLIC_ROOT="$(python -B -c 'import json; print(json.load(open("release-assets/candidate-admission-v2.json",encoding="utf-8"))["public_root_sha256"])')"
          AUTHORITY=(--root . --candidate "$CANDIDATE" \
            --expected-commit "$GITHUB_SHA" --expected-tree "$SOURCE_TREE" \
            --expected-public-root "$PUBLIC_ROOT" \
            --policy contracts/release-authority-policy-v2.json)
          MODE_V2="$(python -B -c 'import json; print(json.load(open("contracts/release-authority-policy-v2.json",encoding="utf-8"))["authority_mode"])')"
          if test "$MODE_V2" = certificate; then
            test -f contracts/release-mechanism-qualification-v2.json
            AUTHORITY+=(--mechanism contracts/release-mechanism-qualification-v2.json)
          else
            test "$MODE_V2" = serial
            test ! -f contracts/release-mechanism-qualification-v2.json
          fi
          python -B tools/loom_release_certificate.py verify \
            --repository . \
            --candidate "$CANDIDATE" \
            --certificate release-assets/release-certificate-v2.json \
            --expected-tag "$RELEASE_TAG" --asset "$ASSET"
          python -B tools/loom_release_authority.py verify \
            "${AUTHORITY[@]}" \
            --candidate-suite release-assets/release-candidate-suite-v2.json \
            --release-certificate release-assets/release-certificate-v2.json \
            --release-authority release-assets/release-authority-v2.json \
            --expected-tag "$RELEASE_TAG" --asset "$ASSET"
          python -B tools/loom_release_certificate.py compile \
            --repository . \
            --candidate "$CANDIDATE" \
            --reproducibility release-assets/reproducibility-receipt.json \
            --rollback release-assets/rollback.json \
            --tag-evidence release-assets/release-tag-evidence-v2.json \
            --promotion draft-promotion-receipt.json \
            --output draft-release-certificate-v2.json
          python -B tools/loom_release_certificate.py verify \
            --repository . \
            --candidate "$CANDIDATE" \
            --certificate draft-release-certificate-v2.json \
            --expected-tag "$RELEASE_TAG" --asset "$ASSET"
          python -B tools/loom_release_authority.py release-authority \
            "${AUTHORITY[@]}" \
            --candidate-suite release-assets/release-candidate-suite-v2.json \
            --release-certificate draft-release-certificate-v2.json \
            --expected-tag "$RELEASE_TAG" --asset "$ASSET" \
            --output draft-release-authority-v2.json
          python -B tools/loom_release_authority.py verify \
            "${AUTHORITY[@]}" \
            --candidate-suite release-assets/release-candidate-suite-v2.json \
            --release-certificate draft-release-certificate-v2.json \
            --release-authority draft-release-authority-v2.json \
            --expected-tag "$RELEASE_TAG" --asset "$ASSET"
      - name: Publish the already-verified draft without changing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
      - name: Reverify same public bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.immutable')" = "true"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/public-release-assets"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/public-release.json"
          python -B tools/loom_release_promotion.py verify-asset-set \
            "$RUNNER_TEMP/public-release-assets" \
            --tag "$RELEASE_TAG" \
            --manifest "$RUNNER_TEMP/public-release-assets/SHA256SUMS" \
            --api-release "$RUNNER_TEMP/public-release.json" \
            --manifest-published
          python -B tools/loom_release_promotion.py verify-public \
            "$RUNNER_TEMP/public-release-assets/loom-plugin-${RELEASE_TAG}.zip" \
            --gate promotion-gate.json \
            --output public-promotion-receipt.json
